name: Deploy

# The "merge to main" half of EXT-064. A merge to main builds and
# publishes the two images and then runs the same deploy script an
# operator would run by hand - so the automated path and the manual path
# are the same path, and neither is exercised only in an emergency.
#
# Staging deploys on every merge. Production is a manual run of this
# workflow, because "merged" and "ready for candidates to see" are not
# the same decision and this app publishes exam status to the public.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  # Two deploys racing leave a host running half of each.
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA as well as a moving tag, so a rollback
      # names an exact build rather than "whatever latest was yesterday".
      - name: Build and push the application image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      # Skipped rather than failed when the host secrets are absent, so
      # the build half still works on a fork or before infrastructure
      # exists - without pretending a deploy happened.
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEPLOY_HOST secret for this environment; images were published but nothing was deployed."
          fi

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ENVIRONMENT: ${{ github.event.inputs.environment == 'production' && 'prod' || 'staging' }}
        run: |
          install -m 600 /dev/null key
          echo "$DEPLOY_KEY" > key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && git fetch --all && git checkout ${{ github.sha }} && ./deploy/deploy.sh $ENVIRONMENT"
