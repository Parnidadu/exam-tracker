services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Same volume as the worker, so `manage.py restore_database` can
      # reach the dumps the nightly job wrote.
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    volumes:
      # Named volume, so nightly dumps outlive the container that wrote
      # them. A backup on a container filesystem is gone at the next deploy.
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Round-trips through the broker, so this proves the worker can
      # actually receive work rather than merely that the process is up.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 5

  beat:
    build:
      context: ./backend
    # No --scheduler flag: CELERY_BEAT_SCHEDULER in settings already
    # selects the database scheduler, and passing it in two places invites
    # them to disagree.
    command: celery -A config beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Beat does not answer inspect pings - it only sends. Checking its
      # pid is alive is the honest test.
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backups:
